<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../CSS.css/Fase3CSS.css"><!-- linka a fase 2 ao seu CSS -->
</head>
<body>
<div id="Fase2Fundo1" class="fundo1" style="display: none;"><!-- div do quarto 1 com id,classe e display -->
     <img id="sala1" 
          src="../imagens/fundo1-fase2.png"><!--chama a imagem -->

     <img id="preto" 
          onclick="avancar2()"
          src="../imagens/preto.jpg"><!--chama a imagem -->

     <img id="estanteDaSala" 
          onclick="avancar()"
          src="../imagens/estante-da-sala.png"><!--chama a imagem -->
          
          <img id="objetoEstranho" 
               onclick="pegarObjetoEstranho()"    
               src="../imagens/pistas livros/objetoEstranho.png">
               <img id="olhos" src="../imagens/olhos-vermelhos.gif">
</div>

     

    <div id="Fase2Fundo2" style="display: none;"><!-- div da parte da estante-->
         <img id="FUNDOestante" src="../imagens/fundo-estante.jpg"><!--imagem do fundo da estante -->
      <div class="divtitulo"><!-- div do titulo-->
           <h2 id="h2">Organize na ordem certa!</h2>
      </div>

    <img id="estante" src="../imagens/estante.png"><!--estante em si -->
    <img id="Tabua" 
         onclick="pegarTabua()"
         src="../imagens/pistas livros/tabuaDeMadeira.png">
         
    <div id="divestante" class="divestante">
          <!--div de cada livro com sua classe e data-color -->
          <div class="livro branco"  data-color="branco" onclick="mandarParaFrente(this)"></div>
        <div class="livro azul"  data-color="azul" onclick="mandarParaFrente(this)"  ></div>
        <div class="livro amarelo"  data-color="amarelo" onclick="mandarParaFrente(this)"></div>
        <div class="livro vermelho" data-color="vermelho" onclick="mandarParaFrente(this)"></div>
        <div class="livro roxo"  data-color="roxo" onclick="mandarParaFrente(this)"></div>
        <div class="livro preto"  data-color="preto" onclick="mandarParaFrente(this)"></div>
        <div class="livro verde"  data-color="verde" onclick="mandarParaFrente(this)"></div>
        <div><p id="parabens" style="display: none;">Parabéns! Você conseguiu organizar os livros na ordem certa!</p></div>
        <div><p id="pessimo" style="display: none;">Péssimo! A ordem está errada!</p></div>

    </div>
    <button id="botaoTestar" onclick="testarCombinação()">Testar Combinação</button><!--botao de testar combinação -->
    <button id="botaoVoltar" onclick="voltar()">Voltar</button><!--botao para voltar-->
</div>

<div id="Fase2Fundo3">
     <img id="olhos2" src="../imagens/olhos-vermelhos.gif">
  <!--Chama as 5 imagens do fundo3-->
  <img id="fase2fundo3" class="fundo3" src="../imagens/fase2-fundo3.png">
  <img id="barril" 
       onclick="pegarBarril()"
       src="../imagens/pistas livros/barril.png">

  <img id="armadura" 
       onclick="pegarArmadura()"
       src="../imagens/pistas livros/armadura.png">

  <img id="baner" 
       onclick="pegarBanner()"
       src="../imagens/pistas livros/Banner.png">

  <img id="caixa"
       onclick="pegarCaixa()"
       src="../imagens/pistas livros/caixa.png">

  <img id="saco"
       onclick="pegarSaco()"
       src="../imagens/pistas livros/saco.png">

  <img id="placa" 
       onclick="voltar()"
       src="../imagens/placa-fase2.png">
  
</div>

<div id="inventario"> <!-- div que guarda o inventário -->
        <h3>Inventário</h3> <!-- titulo do inventário -->
    <ul id="listaInventario"></ul> <!-- id do inventário -->
</div>
<script src="../JavaScript.js/Fase3.js"></script><!-- linka o HTML ao JS da Fase3 -->
</body>
</html>
