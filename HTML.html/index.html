<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle da Estante de Livros</title>
   <link rel="stylesheet" href="../CSS.css/style.css">>
</head>
<body>
    <div class="game-container">
        <h2>Organize os livros na ordem correta!</h2>
        
        <div class="shelf">
            <!-- Cada livro tem sua cor no data-color para o JS ler depois -->
            <div class="book red" draggable="true" data-color="red"></div>
            <div class="book yellow" draggable="true" data-color="yellow"></div>
            <div class="book green" draggable="true" data-color="green"></div>
            <div class="book blue" draggable="true" data-color="blue"></div>
            <div class="book purple" draggable="true" data-color="purple"></div>
        </div>

        <button id="check-btn">Testar Combinação</button>
        <p id="message"></p>
    </div>

   <script src="../JavaScript.js/script.js"></script>
</body>
</html>
