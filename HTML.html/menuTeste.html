<!DOCTYPE html>
><html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menu do Jogo</title>
    <link rel="stylesheet" href="../CSS.css/CSSTeste.css" />
  </head>
  <body>
    <main class="menu-screen">
      <div class="menu-panel">
        <section class="brand" aria-label="Logo e apresentação do jogo">
          <span class="badge">RPG de aventura</span>
          <h1>Rune <span class="accent">Quest</span></h1>
          <p class="subtitle">
            A biblioteca do reino está cercada por sombras. Enfrente enigmas,
            descubra segredos e liberte o mundo das trevas.
          </p>
        </section>

        <aside class="side-panel" aria-label="Menu principal do jogo">
          <nav class="menu-list" aria-label="Menu principal">
            <button class="menu-item active" type="button" data-text="A aventura começa agora no coração do reino perdido.">
              Iniciar Jogo
            </button>
            <button class="menu-item" type="button" data-text="Retome sua aventura e continue sua jornada em um mundo em perigo.">
              Continuar
            </button>
            <button class="menu-item" type="button" data-text="Ajuste áudio, vídeo e controles para sua experiência ideal.">
              Opções
            </button>
            <button class="menu-item" type="button" data-text="Veja os créditos e a equipe por trás da criação desta jornada.">
              Créditos
            </button>
            <button class="menu-item" type="button" data-text="Fechar o jogo e retornar ao menu inicial do sistema.">
              Sair
            </button>
          </nav>

          <div class="status" aria-live="polite">
            <span class="status-label">Status</span>
            <p id="menuStatus" class="status-text">
              A aventura começa agora no coração do reino perdido.
            </p>
        

            <div class="meta">
              <span>Fase 01</span>
              <span>RPG</span>
            </div>
          </div>
        </aside>
      </div>
    </main>

    <script>
      const menuItems = document.querySelectorAll('.menu-item');
      const menuStatus = document.getElementById('menuStatus');

      menuItems.forEach((item) => {
        item.addEventListener('click', () => {
          menuItems.forEach((btn) => btn.classList.remove('active'));
          item.classList.add('active');
          menuStatus.textContent = item.dataset.text || 'Aventura em andamento.';
        });
      });
    </script>
  </body>
</html>
