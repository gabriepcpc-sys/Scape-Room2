<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../CSS.css/Fase1CSS.css"><!-- linka a fase 1 ao seu CSS -->
</head>
<body>
    <button id="avançar" onclick="avancar()">Avançar</button><!-- botao que chama a função avançar -->
    <button id="voltar" onclick="voltar()"style="display: none;" >Retroceder</button> <!-- botao que chama a função retroceder e esta escondido -->

        

    <div id="Fase1Fundo1"><!-- div principal onde guarda a imagem da fase -->

        <img id="FundoFase1" src="../imagens/Fundo1Fase1.png"><!-- a imagem em si-->
        <img onclick="apagarFogo()" id="FogoEsquerda" src="../imagens/Fogos.gif"> <!-- botao que chama a função apagarfogo e chama o gif -->
        <img id="FogoDireita" src="../imagens/Fogos.gif"><!-- chama o fogo da esquerda -->
  
        <div>   
 <!-- funcção que faz a chave poder ser pega com onclick e chama a imagem--> 
        <img 
             onclick="pegarChave()" 
             id="ChaveFase1" src="../imagens/ObjetoFase1.png">
        </div>
        
    </div>
    <div>
        <img id="FogoApagado" src="../imagens/Fundo1Fase1FogoApagado.png" style="display: none;">
    </div>

    <div id="Fase1Fundo2" style="display: none;"> <!-- div que guarda a imagem da segunda fase e esta escondida -->

        <img  src="../imagens/Fundo2Fase1.png"><!-- a imagem em si -->
        <img onclick="pegarPá()" id="PaFase1" src="../imagens/Objeto2Fase1.png"><!-- chama a função que faz a pa poder ser pega e chama a imagem -->
        <img id="PortaFase1" src="../imagens/PORTAfundo2fase1.png"> <!-- chama a imagem da porta-->
    </div>

    <div id="inventario"> <!-- div que guarda o inventário -->
        <h3>Inventário</h3> <!-- titulo do inventário -->
    <ul id="listaInventario"></ul> <!-- id do inventário -->
</div>
    <script src="../JavaScript.js/Fase1.js"></script><!-- linka o HTML ao JS -->
</body>
</html>
